name: "Build and Push Dev/main SentinelProbe Docker Images to DockerHub"

# Disabled until DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are configured.
on:
  workflow_dispatch:
#   push:
#     branches:
#       - "main"
#       - "dev"

jobs:
  build-and-push-dev-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push sentinelprobe-base docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/
          file: ./src/DockerFiles/wolfi-base-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-base:${{ github.head_ref || github.ref_name }}
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/
          file: ./src/DockerFiles/dev/cli-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe:${{ github.head_ref || github.ref_name }}
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe-api docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/
          file: ./src/DockerFiles/dev/backend-api-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-api:${{ github.head_ref || github.ref_name }}
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe-api-worker docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/
          file: ./src/DockerFiles/dev/backend-api-worker-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-api-worker:${{ github.head_ref || github.ref_name }}
          platforms: linux/amd64,linux/arm64
