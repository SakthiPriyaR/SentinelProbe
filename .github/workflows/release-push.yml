name: "Release: Build and Push SentinelProbe Docker Images to DockerHub"

# Disabled until DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are configured.
on:
  workflow_dispatch:
#   release:
#     types: [published]

jobs:
  build-and-push-main-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build and publish version tag image
      - name: Build and push sentinelprobe-base docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/wolfi-base-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-base:${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/main/cli-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe:${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe-api docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/main/backend-api-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-api:${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe-api-worker docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/main/backend-api-worker-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-api-worker:${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64

      # Build and publish latest tag image
      - name: Build and push sentinelprobe-base docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/wolfi-base-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-base:latest
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/main/cli-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe:latest
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe-api docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/main/backend-api-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-api:latest
          platforms: linux/amd64,linux/arm64
      - name: Build and push sentinelprobe-api-worker docker image
        uses: docker/build-push-action@v3
        with:
          context: ./src/
          file: ./src/DockerFiles/main/backend-api-worker-Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinelprobe-api-worker:latest
          platforms: linux/amd64,linux/arm64
