name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[api]" pytest httpx flake8
      - name: Lint (syntax errors and undefined names only)
        run: flake8 sentinelprobe --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest -q
